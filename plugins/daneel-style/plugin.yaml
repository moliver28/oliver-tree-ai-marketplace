name: daneel-style
version: "1.0.0"
description: >
  Writing-style enforcement for the Daneel voice: regex style rules in
  ~/.hermes/scripts/daneel_style_rules.yaml applied on every turn.
  transform_llm_output auto-fixes flagged patterns; pre_llm_call injects a
  compact rule digest each session. Disable with
  style_enforcement.enabled: false in config.yaml.
provides_hooks:
  - transform_llm_output
  - pre_llm_call