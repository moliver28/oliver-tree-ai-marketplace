# weights.yaml - engagement weights for linkedin_render.py --select.
#
# score(kind) = sum over triggered levers of
#               base(kind, lever) * product(situation multipliers that hold)
# Triggered means every slot named by the lever is filled in the brief, per
# the lever's match rule (any/all); link_penalty triggers on the has_link
# situation against commentary_type kinds only.
#
# Deterministic ordering for --select: score desc, then kind name asc.
# --used-kinds LIST demotes those kinds one effective rank step downstream
# (single stable pass, rank k swaps with k+1) without changing scores.
#
# Levers (slots) and their evidence anchors:
#   hook           (STAT, SOURCE)          digit or named source in the first
#                                          210 chars: scroll-stop + saves
#   concreteness   (STORY_EXAMPLES)        concrete language raises sharing
#                                          [SAGE QJEP 2025]
#   utility        (DESIGN_MOVES+TAKEAWAY) practical utility strongest
#                                          virality predictor, r = .31
#                                          [Berger & Milkman 2012]
#   curiosity      (COUNTER)               information-gap curiosity is a
#                                          high comment driver (base weight
#                                          only; the semantic layer is not
#                                          required to quantify it further)
#   question       (QUESTION_TAIL)         specific experience question =
#                                          comment velocity (voicebook close)
#   contrast       (GAP_STAT_PAIR)         delta framing holds dwell
#   currency       (DEFINITION)            coined term = social currency /
#                                          idea association
#   receipt        (FAILURE_ROW)           concrete first-person miss =
#                                          narrative transportation
#   link_penalty   (has_link + commentary) off-platform link drags dwell and
#                                          comments on native commentary;
#                                          never applies to link-required
#                                          kinds, where the link is the point
#
# Every base weight and multiplier carries its anchor in the line comment.
# Sparse table (no weight = 0): a lever only scores for kinds whose structure
# actually carries that slot.

weights:
  hook:
    slots: [STAT, SOURCE]
    match: any
    types:
      announcement-receipt:
        base: 2.6            # V1 opens on the verified digit (scroll-stop)
      practical-tips:
        base: 1.6            # tips post still leads with the number
      named-source:
        base: 2.2            # sentence one is literally SOURCE found STAT
      definition:
        base: 1.2            # concept post: evidentiary lead, hook secondary
      steelman-pivot:
        base: 1.0            # steelman opens on the consensus, not a number
      news-reaction:
        base: 2.0            # reaction still anchors on the factual hook
        situations: {news_hook: 1.4}   # fresh news hook multiplies stop-power
      pure-question:
        base: 2.0            # comment-bait still needs the 210-char anchor
        situations: {news_hook: 1.3}   # a live hook raises the stop-power
      failure-receipt:
        base: 1.0            # receipt hooks on the date/system row, not a metric
  concreteness:
    slots: [STORY_EXAMPLES]
    match: any
    types:
      announcement-receipt:
        base: 2.2            # concrete tool examples in the examples stanza
      practical-tips:
        base: 1.4            # tips stay concrete, examples secondary
      named-source:
        base: 1.6            # boundary examples carry the concreteness
      definition:
        base: 1.2            # examples show where the loose use costs teams
      steelman-pivot:
        base: 1.8            # pivot paragraphs lean on the concrete list
      news-reaction:
        base: 0.8            # reaction keeps one concrete anchor
      pure-question:
        base: 0.5            # concrete framing helps but the close dominates
      failure-receipt:
        base: 0.3            # the receipt row is already concrete
  utility:
    slots: [DESIGN_MOVES, TAKEAWAY]
    match: all
    types:
      announcement-receipt:
        base: 2.4            # imperative practices + imperative specification
      practical-tips:
        base: 3.4            # the kind IS the practical-utility lever (saves)
      named-source:
        base: 0.8            # V2 carries neither slot; kept for completeness
      definition:
        base: 0.8            # V5 carries TAKEAWAY only; block rarely complete
      steelman-pivot:
        base: 1.2            # reframe only; moves optional
      news-reaction:
        base: 0.5            # a reaction may still carry the block
      failure-receipt:
        base: 1.2            # what catches it now is the utility line
  curiosity:
    slots: [COUNTER]
    match: any
    types:
      named-source:
        base: 1.4            # boundary claim opens the gap
      steelman-pivot:
        base: 2.0            # the pivot IS the gap opened politely
      news-reaction:
        base: 2.4            # what the coverage misses = comment bait
  question:
    slots: [QUESTION_TAIL]
    match: any
    types:
      announcement-receipt:
        base: 2.0            # experience close after the utility block
      practical-tips:
        base: 1.9            # tips still close with the experience question
      named-source:
        base: 1.6            # V2 close
      definition:
        base: 1.6            # V5 close
      steelman-pivot:
        base: 1.8            # V3 close
      news-reaction:
        base: 2.2            # reaction close is the discussion starter
      pure-question:
        base: 3.0            # the whole kind is the question (comment velocity)
      failure-receipt:
        base: 1.6            # receipt close
  contrast:
    slots: [GAP_STAT_PAIR]
    match: any
    types:
      definition:
        base: 1.6            # V5 gap pair: the numbers argue for the term
      named-source:
        base: 0.6            # gap stats occasionally ride the claim
  currency:
    slots: [DEFINITION]
    match: any
    types:
      definition:
        base: 1.6            # coined term = the shareable handle
  receipt:
    slots: [FAILURE_ROW]
    match: any
    types:
      failure-receipt:
        base: 3.0            # the verified row is the kind's core leverage
  link_penalty:
    # special trigger: applies only when has_link is true AND the kind is
    # commentary_type (see post_types.yaml); negative weight, never multiplies
    # situations.
    slots: [LINK]
    match: any
    applies_to: commentary
    types:
      news-reaction:
        base: -1.2           # a link drags the native post it rides in
      pure-question:
        base: -1.2           # same drag on the question kind
