# slots.yaml - single source of truth for slot definitions.
#
# Consumers (no cross-imports: each script embeds one identical registry
# loader + YAML-subset parser):
#   linkedin_render.py           brief_keys (was SLOT_BRIEF_KEY), validate_slot()
#                                constraints, list join default_mode and the
#                                generic |clauses/|para/|pair skeleton tokens
#   linkedin_voicebook_check.py  brief_keys (was SLOT_KEYS) + presence semantics
#   linkedin_lever_check.py      TAKEAWAY starts_imperative + imperative_verbs
#
# Adding a slot = an entry here + a skeleton using it. No python change
# (proof: TAGLINE + the tests/linkedin fixtures).
#
# Field reference:
#   kind            text | list | object (object = multi-key slot with a join)
#   brief_keys      JSON keys the slot reads from the brief, in order
#   trim            "end": strip trailing [.!?,:;] + whitespace; "plain": only
#                   whitespace (QUESTION_TAIL keeps its '?', LINK keeps '/' etc.)
#   digit           value must contain a digit
#   single_fragment one fragment only (no internal sentence break)
#   max_sentences   1..n sentences allowed (implies '?' and '!' rejected)
#   is_token        must contain a standalone word 'is' (DEFINITION shape)
#   question        exactly one '?' in the whole value
#   you_your        must address the reader (you/your)
#   no_punct        scan for banned punctuation (em dash, --, !)
#   min_chars / max_chars
#   length_msg      overrides the default "N too long (x chars, max y)" wording
#   must_be_url     bare https:// URL
#   must_be_public  "config": validated against url_allowlist in the config
#                   file (factory default when no config exists: example.org).
#                   app.notion.com is always rejected in code: a private URL
#                   may never pass any config.
#   min_items / max_items / item_min_chars / item_max_chars  list slots
#   default_mode    list join when the skeleton token carries no modifier:
#                   count  = STORY_EXAMPLES legacy (3 items -> para, 2 -> pair)
#                   commas = clause list (DESIGN_MOVES legacy)
#   starts_imperative / imperative_verbs   consumed by linkedin_lever_check.py
#                   (lever gate); the render does not enforce this, unchanged
#   keys / join / per-key strip_end lower_first   object slots (render side)
#
# Constraint semantics are frozen to the legacy per-slot if-chain. Changing a
# value here changes gate behavior; keep diffs reviewable.

STAT:
  kind: text
  brief_keys: [stat]
  digit: true
  single_fragment: true
  no_punct: true
  max_chars: 340
  trim: end

SOURCE:
  kind: text
  brief_keys: [source]
  single_fragment: true
  no_punct: true
  min_chars: 3
  max_chars: 180
  trim: end

TOPIC_CLAIM:
  kind: text
  brief_keys: [topic_claim]
  single_fragment: true
  no_punct: true
  max_chars: 320
  length_msg: "must be one sentence (max 320 chars)"
  trim: end

STORY_EXAMPLES:
  kind: list
  brief_keys: [story_examples]
  min_items: 2
  max_items: 3
  item_min_chars: 15
  item_max_chars: 220
  default_mode: count

DESIGN_MOVES:
  kind: list
  brief_keys: [design_moves]
  min_items: 2
  max_items: 3
  item_min_chars: 4
  item_max_chars: 180
  default_mode: commas

THESIS:
  kind: text
  brief_keys: [thesis]
  max_sentences: 3
  no_punct: true
  max_chars: 640
  trim: end

COUNTER:
  kind: text
  brief_keys: [counter]
  max_sentences: 2
  no_punct: true
  max_chars: 640
  trim: end

DEFINITION:
  kind: text
  brief_keys: [definition]
  max_sentences: 1
  is_token: true
  no_punct: true
  max_chars: 260
  trim: end

GAP_STAT_PAIR:
  kind: object
  brief_keys: [gap_stat_a, gap_stat_b]
  join: "{gap_stat_a}, while {gap_stat_b}"
  keys:
    gap_stat_a:
      string_only: true
      digit: true
      single_fragment: true
      no_punct: true
      max_chars: 200
      strip_end: true
      lower_first: true
    gap_stat_b:
      string_only: true
      digit: true
      single_fragment: true
      no_punct: true
      max_chars: 200
      strip_end: true
      lower_first: true

TAKEAWAY:
  kind: text
  brief_keys: [takeaway]
  max_sentences: 2
  no_punct: true
  max_chars: 640
  trim: end
  # lever-side constraint (linkedin_lever_check.py imperative gate); matched
  # verbatim to the lever script's builtin verb set
  starts_imperative: true
  imperative_verbs: [build, log, expose, verify, keep, run, ship, write, make, name, put, stop, start, ask, read, trace, capture, record, require, surface, gate, audit, label, route, tag, hold, show, map, pick, decide, measure, share, hand, spell, state, treat, design, let, set, walk]

QUESTION_TAIL:
  kind: text
  brief_keys: [question_tail]
  question: true
  you_your: true
  no_punct: true
  max_chars: 200
  length_msg: "too long (max 200 chars)"
  trim: plain

LINK:
  kind: text
  brief_keys: [link]
  must_be_url: true
  must_be_public: config
  trim: plain

PERSON_CONTEXT:
  kind: text
  brief_keys: [person_context]
  no_punct: true
  max_chars: 120
  length_msg: "too long (max 120 chars)"
  trim: end

CONSENSUS_HOLDER:
  kind: text
  brief_keys: [consensus_holder]
  no_punct: true
  max_chars: 60
  length_msg: "too long (max 60 chars)"
  trim: end

# Registry-extension fixture (proof slot; see
# tests/linkedin/fixtures/V_FIXTURES.md). Inert in production: no
# production skeleton requires TAGLINE.
TAGLINE:
  kind: text
  brief_keys: [tagline]
  min_chars: 10
  max_chars: 60
  trim: end

FAILURE_ROW:
  kind: object
  brief_keys: [failure_row]
  join: "in {system} on {date}, {what_broke}; what catches it now: {what_now_catches}"
  keys:
    system:
      strip_end: false
    date:
      strip_end: false
    what_broke:
      strip_end: true
    what_now_catches:
      strip_end: true
