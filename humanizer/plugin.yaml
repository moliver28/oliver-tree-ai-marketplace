plugin:
  name: humanizer-voice
  version: 0.1.0
  description: Learned voice profile + quiet delivery gate; user surface is the /voice command only.
  author: moliver28
  entry: SKILL.md
  command: /voice
  stages:
    learn: read onboarding template from repo root; store filled profile per platform convention
    hooks: optional pre-delivery scan (reference implementation in ../voice-gate/)
    apply: /voice <target> -> rewrite in learned profile -> gate scan -> copy + one status line
  hooks:
    gate: hooks/gate.py (deterministic regex scan; pass = silence/zero tokens; fail = repair contract naming up to 5 family-deduped patterns with in-place fix hints; scan error = fail-open)
    contract: hooks/HOOKS.md
  surfaces:
    user_facing: [/voice]
    background: [learn, scan hooks, logs]
