plugin:
  name: humanizer-voice
  version: 1.3.0
  description: Learned voice profile + quiet delivery gate; user surface is the /voice command only.
  author: moliver28
  entry: SKILL.md
  command: /voice
  stages:
    learn: learn/ (onboarding template + deterministic profile/calibration/distillation/classifier/acceptance tools; zero-LLM)
    hooks: hooks/ (self-contained gate: voice_tells.py scanner + STE layer; pass = zero tokens, fail = patch-in-place repair contract, scan error = fail-open; advisory voice-fit/fidelity/classifier fields cost zero tokens and never block)
    apply: /voice <target> -> rewrite in learned profile -> gate scan -> copy + one status line
  hooks:
    gate: hooks/gate.py (deterministic regex scan; pass = silence/zero tokens; fail = repair contract naming up to 5 family-deduped patterns with in-place fix hints; scan error = fail-open; --source FILE adds source_fidelity, voice_fit and classifier signals appear when their learned artifacts exist — advisory only in 1.1.0, never blocking)
    contract: hooks/HOOKS.md
  learn:
    onboard: learn/VOICE_ONBOARDING.template.md
    tools: [learn/build_voice_profile.py, learn/calibrate.py, learn/distill_phrases.py, learn/voice_vector_build.py, learn/train_voice_classifier.py, learn/edit_learning.py, learn/acceptance_check.py]
    procedure: learn/LEARN-VOICE.md
  surfaces:
    user_facing: [/voice]
    background: [learn, scan hooks, logs]
